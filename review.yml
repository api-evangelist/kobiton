    - DELETE https://api.kobiton.com/v1/apps/{appId}
    - PUT    https://api.kobiton.com/v1/apps/{appId}/private
    - PUT    https://api.kobiton.com/v1/apps/{appId}/public
    - POST   https://api.kobiton.com/v1/apps/{appId}/team/assign
    - GET    https://api.kobiton.com/v1/app/versions/{versionId}
    - DELETE https://api.kobiton.com/v1/app/versions/{versionId}
    - POST   https://api.kobiton.com/v1/app/versions/{versionId}/tag/{name}
    - DELETE https://api.kobiton.com/v1/app/versions/{versionId}/tag/{name}
