sources:
  - url: https://api.kobiton.com/docs
    type: APIReference
    note: Kobiton REST API v1 reference; Basic auth (username:apiKey); Apps, Devices, Data Sets, Organization endpoints. No WebSocket documented.
  - url: https://docs.kobiton.com/
    type: Documentation
    note: Platform docs - real device cloud, manual, automation (Appium), scriptless, and visual testing.
  - url: https://docs.kobiton.com/scriptless-automation/use-rest-api
    type: Documentation
    note: Scriptless automation via POST /v1/revisitPlans/start with exploringSessionIds and deviceBundleId.
  - url: https://github.com/kobiton/samples/tree/master/kobiton-rest-api/get-devices-info
    type: SourceCode
    note: Official sample - GET /v1/devices with Basic auth and query filters.
  - url: https://github.com/kobiton/samples/tree/master/kobiton-rest-api/get-session-data
    type: SourceCode
    note: Official sample - get session data and paginated session commands (currentPage/totalPages).
  - url: https://docs.kobiton.com/debugging/set-up-virtualusb
    type: Documentation
    note: virtualUSB is a desktop/CLI tunnel for remote device debugging, not a public WebSocket API.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Kobiton's documented public API is
    request/response REST (api.kobiton.com/v1, plus a v2) and an HTTP-based
    Appium/WebDriver hub. Its real-time device features (live manual-session
    stream, virtualUSB remote debugging) are delivered through the portal and a
    desktop/CLI tunnel client rather than a documented developer WebSocket
    endpoint, so no AsyncAPI document was created.
