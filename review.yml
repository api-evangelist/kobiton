aid: kobiton
name: Kobiton
review:
  question: Does Kobiton expose a documented public WebSocket API?
  answer: false
  date: '2026-07-11'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Kobiton's documented public API surface
    is request/response REST over HTTPS (https://api.kobiton.com/v1, with a
    newer v2) plus an Appium/WebDriver hub (https://api.kobiton.com/wd/hub) that
    speaks the W3C WebDriver protocol over HTTPS. Neither is a server-push
    transport. Kobiton does stream a live device screen during manual sessions
    and offers "virtualUSB" for remote device debugging, but those are delivered
    through the browser portal and a desktop/CLI tunnel application, not through
    a documented public WebSocket (ws:// or wss://) endpoint that a developer can
    call. There is no documented server-push API to model.
findings:
  summary: |
    Kobiton does not publish a documented public WebSocket API. Kobiton is a
    mobile device cloud and app testing platform. Its documented public
    interfaces are (1) a REST API at https://api.kobiton.com/v1 (a v2 also
    exists at https://api.kobiton.com/v2) authenticated with HTTP Basic auth
    (username/email + API key), covering Devices, Sessions and session commands,
    the App Repository, data-driven testing Data Sets, scriptless automation
    (revisit plans), and Organization administration; and (2) an
    Appium/WebDriver automation hub at https://api.kobiton.com/wd/hub for
    scripted test runs, which is HTTP-based WebDriver, not WebSocket. Kobiton's
    real-time features - the live manual-session device stream and virtualUSB
    remote debugging - run through the web portal and a desktop/CLI tunnel
    client, and are not exposed as a documented public WebSocket endpoint. No
    ws:// or wss:// developer API is documented as of the review date.
  realtime: |
    Kobiton streams a device's screen to the browser during manual/live testing
    sessions and provides virtualUSB, a desktop application plus CLI that
    tunnels a remote real device to a developer's machine (accessible in Android
    Studio / Xcode and via ADB) for debugging. These deliver real-time device
    interaction, but Kobiton does not document a public WebSocket API for them;
    they are product features consumed through the portal and the virtualUSB
    client, not a developer-callable ws:// / wss:// endpoint.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.kobiton.com/v1
      documented: true
      note: Primary REST API (Devices, Sessions, Apps, Data Sets, revisit plans, Organization). A v2 also exists at https://api.kobiton.com/v2.
    - protocol: WebDriver
      scheme: https
      baseURL: https://api.kobiton.com/wd/hub
      documented: true
      note: Appium / Selenium W3C WebDriver hub for scripted automation. HTTP request/response, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No public WebSocket API is documented. The live manual-session stream and virtualUSB remote debugging are delivered via the portal and a desktop/CLI tunnel client, not a documented developer ws:// / wss:// endpoint.
  endpointsConfirmedRest:
