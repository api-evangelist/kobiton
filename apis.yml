name: Kobiton
kind: company
description: Kobiton is a mobile device cloud and app testing platform that lets teams
  run manual, automated, scriptless, and visual tests against real iOS and Android
  devices in the cloud (or on privately managed local devices). Its REST API at
  https://api.kobiton.com/v1 exposes the real device cloud, test sessions and their
  captured commands, the app repository, data-driven test data sets, and scriptless
  (no-code) test runs, while an Appium/WebDriver hub at https://api.kobiton.com/wd/hub
  drives scripted automation. All REST requests authenticate with HTTP Basic auth
  using a Kobiton username (or email) and an API key.
