  description: Kobiton's Appium/WebDriver endpoint for scripted mobile automation.
    Point an Appium or Selenium client at the hub with Kobiton desired capabilities
    to allocate a real device and execute a scripted test run. This is the standard
    W3C WebDriver protocol over HTTPS, not a Kobiton-proprietary REST resource.
