description: >-
  FinOps view of Kobiton spend. Kobiton is billed as a subscription whose
  dominant cost driver is testing minutes consumed against the real-device
  cloud - every manual, scripted (Appium), and scriptless test run draws down a
  monthly minute allowance tied to the plan (Startup 500, Accelerate 3,000,
  Scale 7,500). The REST API and Appium hub carry no separate fee; API-driven
  automation simply consumes the same minutes. Enterprise adds custom-priced
  capabilities (AI/no-code testing, dedicated or on-prem devices, visual and
  performance validation). Private/local device management has historically been
  priced per device slot.
notes: >-
  Per-minute overage rates and Enterprise pricing are not reconciled here;
  verify on the Kobiton pricing page. The biggest optimization lever is reducing
  wasted device time - end idle sessions, scope scriptless/data-driven runs, and
  right-size the monthly minute plan to actual test-run volume.
