meters:
- name: testing_minutes
  description: Minutes of real-device usage consumed by manual, scripted, and scriptless test runs, drawn from the plan allowance.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - device
  - session
- name: device_slots
  description: Private/local devices managed via Device Lab Management, historically billed per device slot per month.
  unit: devices
  aggregation: max
  dimensions:
  - account
- name: subscription_seat
  description: Plan subscription fee for the account/organization.
  unit: month
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track testing minutes consumed per session, device, and team; watch for sessions left running idle.
- name: Allocation
  description: Attribute test runs to teams/projects (via app assignment and organization members) so minute consumption maps to cost centers.
- name: Optimization
  description: End idle sessions, disable idle-quit only when needed, scope scriptless and data-driven runs, and match the monthly minute plan to actual QA volume.
- name: Accountability
  description: Assign owners per team/app and review monthly minute burn against the plan allowance before renewing or upgrading tiers.
